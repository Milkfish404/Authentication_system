<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Improvision</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
            *{
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
                --color: #b78d2d
            }
            body{
                background-color: #222222;
                font-family: 'poppins'
            }
            .logo{
                font-weight: 400;
                color: var(--color);
            }
            span{
                color: gray;
            }
            nav{
                padding: 20px;
                display: flex;
                justify-content: space-between;
            }
            section{
                justify-self: center;
                margin: 20rem 0px;
                color: white;
                text-shadow: 0px 0px 7px;
                width: 700px;
                text-align: center;
                font-size: 3vmin;
            }
            
            ul{
                display: flex;
                gap: 20px;
            }
            ul li{
                list-style: none;
                color: gray;
                padding: 10px;
            }
            .button{
                background-color: var(--color);
                color: white;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <nav>
            <h1 class="logo"><span class=".logo">IMRPO</span>VISION</h1>
            <ul>
                <li>Home</li>
                <li>Contact Us</li>
                <li>Email Us</li>
                <li class="button">Get Started</li>
            </ul>
        </nav>
        <section>
            <h1>"TURN YOUR IDEAS INTO REALITY"</h1>
        </section>
    </body>
</html>
